name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly disclosed CVE in a pinned dependency surfaces even
    # when nobody has pushed.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Type check
        run: mypy app

      - name: Test
        env:
          # Test-only values. Real secrets never live in CI config.
          JWT_SECRET_KEY: ci-test-secret-key-not-used-anywhere-else-0123456789
          ENCRYPTION_KEY: dGVzdC1vbmx5LWZlcm5ldC1rZXktZm9yLWNpLTAxMjM0NT0=
          ENVIRONMENT: test
        run: pytest -q

  backend-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pip-audit==2.7.3

      # Fails the build on a known vulnerability in a pinned dependency.
      - name: pip-audit
        run: pip-audit --strict --requirement requirements.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Fails on any high/critical advisory that is not in
      # scripts/audit-allowlist.json with a written reason and a review date.
      - name: Dependency audit
        run: npm run audit:check

  docker:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Catches a broken Dockerfile or an unresolvable pin before deploy day.
      - name: Build backend image
        run: docker build -t geo-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t geo-frontend:ci ./frontend

      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null
