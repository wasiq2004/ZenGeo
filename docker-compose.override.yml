# Local development overrides - applied automatically by plain `docker compose up`.
# Adds hot reload, source bind-mounts and host-only debug ports.
# This file is NOT used in production (prod passes -f flags explicitly).

services:
  # Throwaway local database so contributors never point their dev environment
  # at the real managed instance. It exists ONLY in this file - the base stack
  # and production talk to an external Postgres over TLS. Treat its data as
  # disposable; `docker compose down -v` is a supported way to reset it.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # Scrypt is the modern default; keeps password hashes strong at rest.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs the same role-bootstrap SQL that a managed deployment applies by
      # hand, so dev and production end up with identical privileges.
      - ./infra/postgres/dev-init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/bootstrap:/bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      # Bound to 127.0.0.1 so the database is reachable from a local psql/GUI
      # but never from the network.
      - "127.0.0.1:5432:5432"
    networks: [internal]

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      args:
        INSTALL_DEV: "true"
    environment:
      ENVIRONMENT: development
      LOG_FORMAT: console
      # Redirect off the managed host onto the throwaway container. The DSN is
      # rebuilt from these components, so any DATABASE_URL in .env must be left
      # unset for local development (see .env.example).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    volumes:
      - ./backend:/app
      - reports_data:/data/reports
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      args:
        INSTALL_DEV: "true"
    environment:
      ENVIRONMENT: development
      LOG_FORMAT: console
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./backend:/app
      - reports_data:/data/reports
    # Solo pool + no prefetch makes worker logs readable while developing.
    command:
      - celery
      - -A
      - app.worker.celery_app.celery_app
      - worker
      - --loglevel=info
      - --pool=solo

  frontend:
    # Vite dev server instead of the static production build.
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: /api/v1
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps Linux-native node_modules out of the Windows mount.
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"

  caddy:
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # Single same-origin entrypoint for development: http://localhost:8080
      - "127.0.0.1:8080:8080"

volumes:
  # Declared here rather than in the base stack, so it exists only for local
  # development. The name is unchanged from when postgres was a base service, so
  # an existing dev database survives the move to managed Postgres.
  postgres_data:
