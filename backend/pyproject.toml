[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "S",   # bandit security checks
    "ASYNC",
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends() in defaults is the documented pattern
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
# Hardcoded credentials in tests are fixtures, not secrets, and S104's
# "binding to all interfaces" is 0.0.0.0 appearing as an SSRF test vector.
"tests/*" = ["S105", "S106", "S311", "S104"]
# SQLAlchemy evaluates `Mapped[...]` annotations at mapper-configuration time
# and resolves related classes by their quoted name via its own registry.
# Unquoting them (UP037) would break relationship setup with a NameError.
"app/db/models/*" = ["UP037"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["alembic/"]
