<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block subject %}CheckGEO.ai{% endblock %}</title>
  </head>
  <body
    style="margin:0;padding:0;background:#0b0e17;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;"
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0e17;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#131725;border-radius:14px;overflow:hidden;border:1px solid #232a3d;">
            <tr>
              <td style="padding:28px 32px 8px 32px;">
                <div style="font-size:15px;font-weight:700;letter-spacing:-0.01em;color:#a5b4fc;">CheckGEO.ai</div>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 32px 32px;color:#e6e9f2;font-size:15px;line-height:1.65;">
                {% block content %}{% endblock %}
              </td>
            </tr>
          </table>
          <div style="max-width:560px;margin-top:16px;color:#6b7488;font-size:12px;line-height:1.6;text-align:center;">
            You are receiving this because an account exists at
            <a href="{{ frontend_url }}" style="color:#8b95ad;">{{ frontend_url }}</a>.
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
