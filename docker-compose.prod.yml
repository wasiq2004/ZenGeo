# =============================================================================
# PRODUCTION stack, deployed by Dokploy on a 1 vCPU VPS.
#
# Self-contained: database, cache, API, worker, frontend and the internal
# router all run from this one file, and a one-shot `init` service applies the
# migrations and creates the first admin. It does NOT layer on
# docker-compose.yml - a single -f is all it ever needs.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# ---------------------------------------------------------------------------
# Dokploy owns ports 80 and 443.
#
# Its Traefik terminates TLS and issues the Let's Encrypt certificate, so
# nothing here publishes a port and nothing here requests a certificate. The
# `caddy` service is an INTERNAL router only: it takes plain HTTP from Traefik
# on :8080 and splits the hostname across the API and the SPA.
#
# In Dokploy, add ONE domain:
#     Domain     zgeoai.zenautomations.in
#     Service    caddy
#     Port       8080
#     HTTPS      on  (Let's Encrypt)
# Do not add domain entries for `backend` or `frontend` - Caddy already routes
# between them, and a second entry would fight it for the same hostname.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# Sized for 1 vCPU.
#
# `deploy.resources.limits.cpus` is a hard per-container ceiling and Docker
# refuses any value above the host's core count - a 1.5 here is what made the
# first deploy fail with "range of CPUs is from 0.01 to 1.00". Every value below
# is <= 1.00. They are ceilings, not reservations, so they do not need to sum to
# 1.00; a container simply cannot exceed its own line.
#
# Memory totals roughly 2.2 GB across the stack, leaving room for Dokploy,
# Traefik and the OS on a 4 GB box. On a 2 GB box, halve `backend`, `worker`
# and `postgres` and drop the worker to --concurrency=1.
# ---------------------------------------------------------------------------
#
# The database runs HERE, in a container, on this box. Losing the VPS loses the
# application AND the data. Backups are not optional: set BACKUP_REMOTE and put
# infra/backup/pg_backup.sh on a cron.
# =============================================================================

# Dokploy generates its own project name per deployment, so this is mostly
# cosmetic there. It still matters if you ever run the file by hand: it must not
# collide with the development stack's "geo-audit", because both declare a
# postgres_data volume and `down -v` would take the wrong database.
name: geo-audit-prod

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

# The API, the worker and the one-shot init job are the same image with the same
# environment - only the command differs.
x-backend-env: &backend-env
  ENVIRONMENT: production
  LOG_FORMAT: json
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  # The hop to Postgres never leaves this box, but the application refuses to
  # start in production on anything weaker than `require`, and encrypting a
  # loopback-equivalent hop costs nothing. The server below serves TLS with a
  # self-signed certificate, which is exactly what `require` expects: encrypt,
  # do not verify the chain.
  POSTGRES_SSLMODE: require
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  postgres:
    # Debian rather than -alpine: this image ships the openssl binary, which the
    # command below needs to mint the server certificate. Do not point an
    # existing alpine PGDATA at this image - musl and glibc sort text
    # differently and the indexes would be subtly wrong.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the Dokploy Environment tab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the Dokploy Environment tab}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the Dokploy Environment tab}
      # Consumed by the init hooks below to create the least-privilege role and
      # to rewrite pg_hba.conf so plain-TCP connections are refused outright.
      # The development stack leaves REQUIRE_TLS unset, because its Postgres
      # serves no TLS at all.
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REQUIRE_TLS: "true"
      # Scrypt is the modern default; keeps password hashes strong at rest.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    # Generate a self-signed server certificate on first boot, then hand off to
    # the stock entrypoint with TLS switched on. The certificate lives on its own
    # volume rather than in PGDATA, because initdb refuses to initialise a data
    # directory that already has files in it.
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /certs/server.key ]; then
          openssl req -new -x509 -days 3650 -nodes \
            -out /certs/server.crt -keyout /certs/server.key -subj "/CN=postgres"
        fi
        chown postgres:postgres /certs/server.crt /certs/server.key
        chmod 600 /certs/server.key
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/certs/server.crt \
          -c ssl_key_file=/certs/server.key
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_certs:/certs
      # Creates the least-privilege runtime role on first start, so the manual
      # bootstrap step a managed provider would have needed is not required.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/bootstrap:/bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Deliberately no `ports:` - the database is reachable only from this
    # compose network. Never publish 5432.
    shm_size: 256mb
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 512m}
    logging: *logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 192m}
    logging: *logging
    networks: [internal]

  # One-shot job: applies migrations, then creates or promotes the first admin.
  # backend and worker wait for it to exit 0, so a single deploy yields a working
  # login rather than an empty schema. Both steps are idempotent, so it is safe
  # that this re-runs on every deploy.
  init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    env_file: [.env]
    environment: *backend-env
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.scripts.seed_admin
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: {cpus: "1.00", memory: 512m}
    logging: *logging
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # INSTALL_DEV deliberately unset - the image defaults it to false, so
      # pytest/ruff/mypy stay out of the production image.
    restart: unless-stopped
    env_file: [.env]
    environment: *backend-env
    volumes:
      - reports_data:/data/reports
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 640m}
    logging: *logging
    networks: [internal]

  worker:
    # Same image as the backend - only the command differs.
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment: *backend-env
    # --concurrency=2 rather than 4: on a single core, more workers buy nothing
    # and each one is a whole Python process holding its own memory. Audits are
    # IO-bound (fetching pages, waiting on LLM APIs), so two overlap usefully.
    command:
      - celery
      - -A
      - app.worker.celery_app.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
      - --max-tasks-per-child=50
    volumes:
      - reports_data:/data/reports
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    read_only: true
    # WeasyPrint writes font caches to /tmp while rendering the PDF.
    tmpfs: ["/tmp:size=256m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: {cpus: "1.00", memory: 768m}
    logging: *logging
    networks: [internal]

  frontend:
    # Static SPA build served by nginx. The API base URL is baked in at build
    # time, so changing it means a rebuild, not a restart.
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # No cap_drop here: nginx binds :80 inside the container as the unprivileged
    # nginx user, which needs the default capability set to stay intact.
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 96m}
    logging: *logging
    networks: [internal]

  caddy:
    # Internal router only. Traefik terminates TLS and forwards plain HTTP here;
    # this splits /api and /health* to the backend and everything else to the
    # SPA, and applies the security headers. No ports, no ACME.
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    volumes:
      - ./infra/caddy/Caddyfile.dokploy:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 96m}
    logging: *logging
    # `internal` to reach backend and frontend; `dokploy-network` so Traefik can
    # reach this container. It is the ONLY service on both.
    networks: [internal, dokploy-network]

volumes:
  # postgres_data is the production database. Nothing else on this box should
  # ever be allowed to remove it.
  postgres_data:
  postgres_certs:
  redis_data:
  reports_data:
  caddy_data:
  caddy_config:

networks:
  # Nothing on `internal` is reachable from outside this stack.
  internal:
  # Created and owned by Dokploy - this stack joins it, it does not define it.
  dokploy-network:
    external: true
